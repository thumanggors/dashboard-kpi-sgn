<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard KPI</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#e3e6ec;--ac:#2563eb;--g:#16a34a;--y:#d97706;--r:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--tx:#e8ebf2;--mut:#8f98ab;--bd:#2a3140;--ac:#60a5fa;--g:#4ade80;--y:#fbbf24;--r:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:18px;margin:0;flex:1}.mut{color:var(--mut);font-size:12px}
select,input{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
main{padding:16px;max-width:1200px;margin:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.big{font-size:26px;font-weight:700}
.divs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.div{cursor:pointer}.div.on{outline:2px solid var(--ac)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%}
h2{font-size:15px;margin:16px 0 8px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:12px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{cursor:pointer;color:var(--mut);font-size:12px;user-select:none}td.n,th.n{text-align:right}
.pill{padding:2px 8px;border-radius:99px;font-weight:600;font-size:12px;color:#fff}
.g{background:var(--g)}.y{background:var(--y)}.r{background:var(--r)}
.tx-g{color:var(--g)}.tx-y{color:var(--y)}.tx-r{color:var(--r)}
#err{color:var(--r);font-size:12px}
#lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9}
#lock[hidden]{display:none}#lf{display:grid;gap:10px;width:min(320px,90vw)}
button{padding:8px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="lock" hidden><form id="lf" class="card"><b>Dashboard KPI</b><p class="mut">Masukkan password untuk melihat data.</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Password" required autofocus>
<button>Buka</button><p id="lerr" class="tx-r"></p></form></div>
<header>
  <h1>Dashboard KPI <span class="mut" id="upd"></span></h1>
  <select id="per"></select>
  <input id="q" placeholder="Cari nama / jabatan / area…">
</header>
<main>
  <div class="kpis" id="kpis"></div>
  <h2>Per Divisi <span class="mut">(klik untuk memfilter)</span></h2>
  <div class="divs" id="divs"></div>
  <h2>Per Orang <span class="mut" id="cnt"></span></h2>
  <div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
  <p id="err"></p>
</main>
<script>
const REFRESH=30000; // ms; data.js dicek ulang otomatis
let D={rows:[],updated:"",errors:[]},div=null,sort={k:"skor",d:-1};
const $=id=>document.getElementById(id), pct=v=>v==null?"-":(v*100).toFixed(1)+"%";
const cls=v=>v>=.9?"g":v>=.7?"y":"r", avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLS=[["nama","Nama"],["divisi","Divisi"],["jabatan","Jabatan"],["area","Area"],["kehadiran","Kehadiran",1],["kedisiplinan","Disiplin",1],["target","Target",1],["skor","Skor Akhir",1]];

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let PW=null;try{PW=sessionStorage.getItem("kpipw")}catch(e){}
async function decrypt(e,pw){ // coba password ke tiap grup; yang cocok terbuka. Hasil = gabungan divisi yang boleh dilihat
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const out={rows:[],updated:"",errors:[]};
  for(const g of e.groups){
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(g.salt),iterations:e.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    for(const it of g.items){
      try{const o=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(it.iv)},key,b64(it.ct))));
        out.rows.push(...o.rows);out.updated=o.updated}catch(_){break} // salah password untuk grup ini
    }
  }
  if(!out.rows.length)throw 0;
  return out;
}
function load(){ // inject script + cache-buster: jalan di file:// maupun web hosting
  const s=document.createElement("script");s.src="data.enc.js?t="+Date.now();
  s.onload=async()=>{s.remove();
    if(!PW)return;
    try{D=await decrypt(window.KPI_ENC,PW);$("lock").hidden=true;render()}
    catch(e){PW=null;try{sessionStorage.removeItem("kpipw")}catch(_){}$("lock").hidden=false;$("lerr").textContent="Password salah."}};
  s.onerror=()=>{$("err").textContent="data tidak ditemukan / gagal dimuat.";s.remove()};
  document.head.appendChild(s);
}
$("lf").onsubmit=ev=>{ev.preventDefault();PW=$("pw").value;$("lerr").textContent="";try{sessionStorage.setItem("kpipw",PW)}catch(e){}load()};
if(!PW)$("lock").hidden=false;
function render(){
  const pers=[...new Set(D.rows.map(r=>r.periode))].sort().reverse(), cur=$("per").value||pers[0];
  $("per").innerHTML=pers.map(p=>`<option ${p==cur?"selected":""}>${p}</option>`).join("");
  $("upd").textContent="· data diperbarui "+D.updated;
  $("err").textContent=D.errors.length?"Gagal baca: "+D.errors.join("; "):"";
  const rows=D.rows.filter(r=>r.periode==cur), q=$("q").value.toLowerCase();
  const names=[...new Set(rows.map(r=>r.divisi))].sort();
  $("kpis").innerHTML=[["Rata-rata skor",pct(avg(rows.map(r=>r.skor))),cls(avg(rows.map(r=>r.skor)))],
    ["Karyawan",rows.length],["Divisi",names.length],
    ["Skor ≥ 90%",rows.filter(r=>r.skor>=.9).length,"g"],["Skor < 70%",rows.filter(r=>r.skor<.7).length,"r"]]
    .map(([t,v,c])=>`<div class="card"><div class="mut">${t}</div><div class="big ${c?"tx-"+c:""}">${v}</div></div>`).join("");
  $("divs").innerHTML=names.map(n=>{const a=rows.filter(r=>r.divisi==n),m=avg(a.map(r=>r.skor));
    return `<div class="card div ${div==n?"on":""}" data-d="${esc(n)}"><b>${esc(n)}</b> <span class="mut">${a.length} orang</span>
    <div class="big tx-${cls(m)}">${pct(m)}</div><div class="bar"><i class="${cls(m)}" style="width:${Math.min(m,1)*100}%"></i></div></div>`}).join("");
  document.querySelectorAll(".div").forEach(e=>e.onclick=()=>{div=div==e.dataset.d?null:e.dataset.d;render()});
  let list=rows.filter(r=>(!div||r.divisi==div)&&(r.nama+r.jabatan+r.area).toLowerCase().includes(q));
  list.sort((a,b)=>(a[sort.k]>b[sort.k]?1:a[sort.k]<b[sort.k]?-1:0)*sort.d);
  $("cnt").textContent=`(${list.length}${div?" · "+div:""})`;
  $("th").innerHTML="<tr><th>#</th>"+COLS.map(([k,t,n])=>`<th class="${n?"n":""}" data-k="${k}">${t}${sort.k==k?(sort.d>0?" ▲":" ▼"):""}</th>`).join("")+"</tr>";
  document.querySelectorAll("th[data-k]").forEach(e=>e.onclick=()=>{sort={k:e.dataset.k,d:sort.k==e.dataset.k?-sort.d:-1};render()});
  $("tb").innerHTML=list.map((r,i)=>`<tr><td class="mut">${i+1}</td>`+COLS.map(([k,,n])=>
    k=="skor"?`<td class="n"><span class="pill ${cls(r.skor)}">${pct(r.skor)}</span></td>`:n?`<td class="n">${pct(r[k])}</td>`:`<td>${esc(r[k])}</td>`).join("")+"</tr>").join("");
}
$("per").onchange=render;$("q").oninput=render;
load();setInterval(load,REFRESH);
</script>
</body>
</html>
